name: GoRest API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check GoRest GET /users availability and response time
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          node <<'NODE'
          const start = Date.now();
          fetch('https://gorest.co.in/public/v2/users', {
            headers: { Authorization: `Bearer ${process.env.GOREST_TOKEN}` }
          }).then(async response => {
            const elapsed = Date.now() - start;
            console.log(`HTTP status: ${response.status}`);
            console.log(`Response time: ${elapsed} ms`);
            if (!response.ok) {
              console.error(await response.text());
              process.exit(1);
            }
            if (elapsed >= 800) {
              console.error(`Response time must be below 800ms; got ${elapsed}ms`);
              process.exit(1);
            }
            console.log('Monitor PASS: API is available and response time is below 800ms.');
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
